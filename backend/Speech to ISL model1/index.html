<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Speech to ISL</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0f1a;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      gap: 28px;
    }

    h1 { font-size: 1.6rem; letter-spacing: 1px; color: #a78bfa; }

    #mic-btn {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: #1e1e2e;
      box-shadow: 0 0 0 4px #a78bfa44;
      transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #mic-btn:hover { transform: scale(1.06); }

    #mic-btn.active {
      background: #7c3aed;
      box-shadow: 0 0 0 6px #a78bfa88, 0 0 24px #a78bfa66;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 6px #a78bfa88, 0 0 24px #a78bfa66; }
      50%       { box-shadow: 0 0 0 12px #a78bfa44, 0 0 40px #a78bfa44; }
    }

    #mic-btn svg { width: 38px; height: 38px; fill: #e0e0e0; }

    #status {
      font-size: 0.95rem;
      color: #94a3b8;
      min-height: 1.2em;
    }

    #transcript {
      font-size: 1rem;
      color: #c4b5fd;
      max-width: 480px;
      text-align: center;
      min-height: 1.4em;
    }

    #video-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    #sign-label {
      font-size: 1.1rem;
      font-weight: 600;
      color: #a78bfa;
      min-height: 1.4em;
    }

    #sign-video {
      width: 360px;
      max-width: 90vw;
      border-radius: 12px;
      background: #1e1e2e;
      display: none;
    }

    #sign-counter {
      font-size: 0.85rem;
      color: #64748b;
      min-height: 1.2em;
    }
  </style>
</head>
<body>

  <h1>🤟 Speech to ISL</h1>

  <button id="mic-btn" title="Click to start/stop recording">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-1 18.93V22h2v-2.07A8.001 8.001 0 0 0 20 12h-2a6 6 0 0 1-12 0H4a8.001 8.001 0 0 0 7 7.93z"/>
    </svg>
  </button>

  <div id="status">Click the mic to start speaking</div>
  <div id="transcript"></div>

  <div id="video-area">
    <div id="sign-label"></div>
    <video id="sign-video" autoplay></video>
    <div id="sign-counter"></div>
  </div>

  <script>
    const btn        = document.getElementById('mic-btn');
    const status     = document.getElementById('status');
    const transcript = document.getElementById('transcript');
    const signVideo  = document.getElementById('sign-video');
    const signLabel  = document.getElementById('sign-label');
    const signCounter= document.getElementById('sign-counter');

    let isRecording = false;
    let videoQueue  = [];
    let currentIdx  = 0;

    btn.addEventListener('click', async () => {
      if (!isRecording) {
        await startRecording();
      } else {
        await stopRecording();
      }
    });

    async function startRecording() {
      isRecording = true;
      btn.classList.add('active');
      status.textContent = '🎙️ Listening… click mic to stop';
      transcript.textContent = '';
      signLabel.textContent = '';
      signCounter.textContent = '';
      signVideo.style.display = 'none';
      videoQueue = [];

      await fetch('http://localhost:5000/start', { method: 'POST' });
    }

    async function stopRecording() {
      isRecording = false;
      btn.classList.remove('active');
      status.textContent = 'Processing…';

      const res  = await fetch('http://localhost:5000/stop', { method: 'POST' });
      const data = await res.json();

      if (data.error) {
        status.textContent = '⚠️ Error: ' + data.error;
        return;
      }

      transcript.textContent = data.text ? `"${data.text}"` : '(nothing recognized)';

      if (!data.videos || data.videos.length === 0) {
        status.textContent = 'No matching signs found.';
        return;
      }

      status.textContent = `Showing ${data.videos.length} sign(s)`;
      videoQueue = data.videos;
      currentIdx = 0;
      playNext();
    }

    function playNext() {
      if (currentIdx >= videoQueue.length) {
        status.textContent = 'Done ✓  Click mic to speak again';
        signLabel.textContent = '';
        signCounter.textContent = '';
        signVideo.style.display = 'none';
        return;
      }

      const rel   = videoQueue[currentIdx];
      const label = rel.split('/').pop().replace('.mp4', '');
      signLabel.textContent   = label;
      signCounter.textContent = `Sign ${currentIdx + 1} / ${videoQueue.length}`;
      signVideo.src           = `http://localhost:5000/video/${rel}`;
      signVideo.style.display = 'block';
      signVideo.load();
      signVideo.play();
    }

    signVideo.addEventListener('ended', () => {
      currentIdx++;
      playNext();
    });
  </script>
</body>
</html>
