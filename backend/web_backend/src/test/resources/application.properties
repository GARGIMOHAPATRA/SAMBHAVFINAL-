# =========================================================================
# ACCESSIBLE CONNECT - TEST ENVIRONMENT CONFIGURATION
# =========================================================================

# Database connection: In-memory H2 database in PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enforce Flyway as the schema creator and Hibernate as the validator
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Allow Hikari connections to fail fast during tests
spring.datasource.hikari.initialization-fail-timeout=5000
