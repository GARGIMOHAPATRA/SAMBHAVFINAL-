spring.application.name=accessible-connect-backend

# -------------------------------------------------------------------------
# DATABASE CONFIGURATION
# -------------------------------------------------------------------------

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DATABASE_USERNAME:postgres.ipmlwhbyslvgkuubgalz}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------------------
# DATABASE RESILIENCE & TOLERANCE
# -------------------------------------------------------------------------

spring.datasource.hikari.initialization-fail-timeout=-1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# -------------------------------------------------------------------------
# CORS SETTINGS
# -------------------------------------------------------------------------

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# -------------------------------------------------------------------------
# SERVER SETTINGS
# -------------------------------------------------------------------------

server.port=${PORT:8080}

# -------------------------------------------------------------------------
# LIVEKIT SETTINGS
# -------------------------------------------------------------------------

livekit.url=${LIVEKIT_URL:}
livekit.apiKey=${LIVEKIT_API_KEY:}
livekit.apiSecret=${LIVEKIT_API_SECRET:}

# -------------------------------------------------------------------------
# AI & SPEECH CONFIGURATIONS
# -------------------------------------------------------------------------

app.ai.provider=${AI_PROVIDER:mock}
app.stt.provider=${STT_PROVIDER:mock}

# -------------------------------------------------------------------------
# SIGN SEQUENCE SETTINGS
# -------------------------------------------------------------------------

app.sign-assets.provider=${SIGN_ASSET_PROVIDER:mock}
app.sign-assets.default-duration-ms=${SIGN_ASSET_DEFAULT_DURATION:1000}

# -------------------------------------------------------------------------
# SUPABASE STORAGE CONFIGURATIONS
# -------------------------------------------------------------------------

app.supabase.url=${SUPABASE_URL:}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.supabase.storage-bucket=${SUPABASE_STORAGE_BUCKET:isl-sign-assets}

app.sign-assets.signed-url-expiration-seconds=${SIGNED_URL_EXPIRATION_SECONDS:300}
app.sign-assets.max-file-size-mb=${SIGN_ASSETS_MAX_FILE_SIZE_MB:50}

app.sign-sequence.unsupported-pause-ms=${UNSUPPORTED_PAUSE_MS:1500}

# -------------------------------------------------------------------------
# JACKSON SERIALIZATION SETTINGS
# -------------------------------------------------------------------------

# Serialize Java enums as their name string (e.g. "FOUND") instead of ordinal
# integer (e.g. 0). Required for correct frontend deserialization of
# AssetResolutionStatus, AssetStatus, VerificationStatus, StorageStatus.
spring.jackson.serialization.write-enums-using-to-string=true

# -------------------------------------------------------------------------
# EMAIL / SMTP CONFIGURATION
# -------------------------------------------------------------------------
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000