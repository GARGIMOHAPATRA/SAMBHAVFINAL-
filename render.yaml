services:
  # ---------------------------------------------------------------------------
  # 1. BACKEND WEB SERVICE (Spring Boot 3 + Java 17)
  # ---------------------------------------------------------------------------
  - type: web
    name: signbridge-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: signbridge-frontend
          property: host

  # ---------------------------------------------------------------------------
  # 2. FRONTEND STATIC SITE (React + Vite + Tailwind CSS)
  # ---------------------------------------------------------------------------
  - type: static
    name: signbridge-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://signbridge-backend-k4k5.onrender.com
      - key: VITE_API_BASE_URL
        value: https://signbridge-backend-k4k5.onrender.com
